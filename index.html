<!DOCTYPE html>
<html lang="id" data-theme="light" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SITH-One</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth">

  <!-- Overlay awal -->
  <div id="boot" class="boot" role="status" aria-live="polite">
    <div class="brand-mark">S1</div>
    <div class="spinner-border text-primary mt-3" aria-hidden="true"></div>
    <p class="mt-3 mb-0 text-muted">Memuat SITH-One…</p>
  </div>

  <!-- Tombol tema khusus layar login -->
  <button class="icon-btn theme-fab" onclick="toggleTheme()" aria-label="Ganti mode terang/gelap"><i class="bi bi-moon-stars"></i></button>

  <!-- Sidebar (desktop ≥ 992px) -->
  <aside id="sidebar" class="sidebar" aria-label="Navigasi utama">
    <div class="sb-brand"><div class="brand-mark" id="sbLogo">S1</div><div><div class="brand-name" id="sbName">SITH-One</div><div class="brand-sub" id="sbRole">Portal Sekolah</div></div></div>
    <nav id="sideNav" class="sb-nav"></nav>
    <div class="sb-foot">
      <button class="sb-link" onclick="toggleTheme()"><i class="bi bi-moon-stars"></i><span>Mode Gelap</span></button>
      <button class="sb-link text-danger-x" onclick="doLogout()"><i class="bi bi-box-arrow-left"></i><span>Keluar</span></button>
    </div>
  </aside>

  <!-- Bilah atas -->
  <header id="topbar" class="topbar">
    <div class="tb-brand"><div class="brand-mark sm" id="tbLogo">S1</div><span class="brand-name" id="tbName">SITH-One</span></div>
    <h1 id="pageTitle" class="tb-title">Beranda</h1>
    <div class="tb-actions">
      <button class="icon-btn d-lg-none" onclick="toggleTheme()" aria-label="Ganti mode terang/gelap"><i class="bi bi-moon-stars"></i></button>
      <button class="icon-btn" onclick="navigateTo('info')" aria-label="Pengumuman"><i class="bi bi-bell"></i></button>
      <button class="avatar-btn" id="tbAvatar" onclick="navigateTo('profil')" aria-label="Profil saya">?</button>
    </div>
  </header>

  <!-- KONTAINER SPA -->
  <main id="main" class="main"><div id="app-container"></div></main>

  <!-- Navigasi bawah (HP) -->
  <nav id="bottomNav" class="bottom-nav" aria-label="Navigasi bawah"></nav>

  <!-- Menu "Lainnya" (HP) -->
  <div class="offcanvas offcanvas-bottom sheet" tabindex="-1" id="moreMenu" aria-labelledby="moreTitle">
    <div class="offcanvas-header"><h2 class="h6 mb-0" id="moreTitle">Menu Lainnya</h2><button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Tutup"></button></div>
    <div class="offcanvas-body"><div id="moreList" class="more-grid"></div></div>
  </div>

  <!-- Modal formulir generik -->
  <div class="modal fade" id="formModal" tabindex="-1" aria-labelledby="formTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <form class="modal-content" id="formEl" onsubmit="submitForm(event)" novalidate>
        <div class="modal-header"><h2 class="modal-title h5" id="formTitle">Formulir</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button></div>
        <div class="modal-body" id="formBody"></div>
        <div class="modal-footer"><button type="button" class="btn-x btn-ghost" data-bs-dismiss="modal">Batal</button><button type="submit" class="btn-x btn-primary-x" id="formSubmit">Simpan</button></div>
      </form>
    </div>
  </div>

  <!-- Modal tampilan generik -->
  <div class="modal fade" id="viewModal" tabindex="-1" aria-labelledby="viewTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
      <div class="modal-content">
        <div class="modal-header"><h2 class="modal-title h5" id="viewTitle">Detail</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button></div>
        <div class="modal-body" id="viewBody"></div>
        <div class="modal-footer" id="viewFoot"><button type="button" class="btn-x btn-ghost" data-bs-dismiss="modal">Tutup</button></div>
      </div>
    </div>
  </div>

  <!-- Modal konfirmasi -->
  <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm"><div class="modal-content">
      <div class="modal-body"><p id="confirmMsg" class="mb-0">Yakin?</p></div>
      <div class="modal-footer"><button type="button" class="btn-x btn-ghost" data-bs-dismiss="modal">Batal</button><button type="button" class="btn-x btn-danger-x" id="confirmYes">Ya, lanjutkan</button></div>
    </div></div>
  </div>

  <div id="printArea" class="print-area"></div>
  <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index:2000" id="toastBox"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
